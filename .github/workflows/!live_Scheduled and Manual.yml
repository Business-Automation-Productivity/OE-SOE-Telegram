name: live_Scheduled and Manual

on:
  workflow_dispatch:
    inputs:
      poster:
        description: 'Poster'
        type: choice
        options: [POSTER_A, POSTER_B]
        default: POSTER_A
      target:
        description: 'Destinasi (test = selamat)'
        type: choice
        options: [test, live]
        default: test

concurrency:
  group: telegram-poster
  cancel-in-progress: false

jobs:
  post-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log masa
        run: TZ=Asia/Kuala_Lumpur date

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pyTelegramBotAPI

      - name: Run poster
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ inputs.target == 'live' && secrets.CHAT_ID || secrets.CHAT_ID_TEST }}
        run: python bot2.py ${{ inputs.poster }}
